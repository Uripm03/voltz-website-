<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Atom design representing "VOLTZ" -->
  <g id="atom">
    <!-- Center circle -->
    <circle cx="100" cy="100" r="15" fill="#00BCD4"/>

    <!-- Orbital rings -->
    <ellipse cx="100" cy="100" rx="70" ry="30" stroke="#00BCD4" stroke-width="4" fill="none" transform="rotate(0 100 100)"/>
    <ellipse cx="100" cy="100" rx="70" ry="30" stroke="#00BCD4" stroke-width="4" fill="none" transform="rotate(60 100 100)"/>
    <ellipse cx="100" cy="100" rx="70" ry="30" stroke="#00BCD4" stroke-width="4" fill="none" transform="rotate(120 100 100)"/>

    <!-- Electrons -->
    <circle cx="170" cy="100" r="8" fill="#00E5FF"/>
    <circle cx="30" cy="100" r="8" fill="#00E5FF"/>
    <circle cx="135" cy="40" r="8" fill="#00E5FF"/>
    <circle cx="65" cy="160" r="8" fill="#00E5FF"/>
    <circle cx="65" cy="40" r="8" fill="#00E5FF"/>
    <circle cx="135" cy="160" r="8" fill="#00E5FF"/>
  </g>
</svg>
